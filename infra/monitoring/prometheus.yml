# Prometheus local. La API protege /v1/health/metrics con METRICS_TOKEN: ponlo en el archivo de credenciales (no en este YAML).
global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: prospecting-api
    metrics_path: /v1/health/metrics
    authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics_token }
    static_configs: [{ targets: ["api:3001"] }]
  - job_name: prospecting-worker   # worker_* llegan por el textfile collector de node-exporter
    static_configs: [{ targets: ["node-exporter:9100"] }]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
