apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      automountServiceAccountToken: false
      containers:
      - name: web
        image: app-web
        ports:
          - containerPort: 3000
        envFrom:
          - configMapRef: { name: app-config }
        readinessProbe:
          tcpSocket: { port: 3000 }
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 3000 }
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
          - { name: tmp, mountPath: /tmp }
          - { name: next-cache, mountPath: /app/apps/web/.next/cache }
        resources:
          requests: { cpu: 200m, memory: 256Mi }
          limits: { cpu: "1", memory: 512Mi }
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
          seccompProfile: { type: RuntimeDefault }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: next-cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports:
    - port: 3000
      targetPort: 3000
