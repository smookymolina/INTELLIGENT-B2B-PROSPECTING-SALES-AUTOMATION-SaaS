apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      automountServiceAccountToken: false
      containers:
      - name: worker
        image: app-api
        command: ["node", "dist/worker/main.js"]
        envFrom:
          - configMapRef: { name: app-config }
        env:
          - name: DATABASE_URL
            valueFrom: { secretKeyRef: { name: app-secrets, key: DATABASE_URL } }
          - name: REDIS_URL
            valueFrom: { secretKeyRef: { name: app-secrets, key: REDIS_URL } }
          - name: HMAC_SECRET
            valueFrom: { secretKeyRef: { name: app-secrets, key: HMAC_SECRET } }
          - name: ENCRYPTION_KEY
            valueFrom: { secretKeyRef: { name: app-secrets, key: ENCRYPTION_KEY } }
          - name: WORKER_METRICS_FILE
            value: /metrics/worker.prom
        volumeMounts:
          - { name: metrics, mountPath: /metrics }
        # Sin puerto HTTP: liveness por existencia del fichero de metricas que escribe el worker.
        livenessProbe:
          exec: { command: ["sh", "-c", "test -f /metrics/worker.prom"] }
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests: { cpu: 250m, memory: 384Mi }
          limits: { cpu: "1", memory: 768Mi }
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
          seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: metrics
          emptyDir: {}
