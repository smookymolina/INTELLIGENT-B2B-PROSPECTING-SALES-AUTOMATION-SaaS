services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: prospecting
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d prospecting"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  # Full stack: `docker compose --profile app up --build`. Secrets come from .env (see .env.example); the API and the migrate step refuse to start if they are missing or too short.
  migrate:
    profiles: ["app"]
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/prospecting?schema=public
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    profiles: ["app"]
    build: { context: ., target: api }
    environment:
      DATABASE_URL: postgresql://app_login:${APP_DB_PASSWORD:-}@postgres:5432/prospecting?schema=public
      REDIS_URL: redis://redis:6379
      HMAC_SECRET: ${HMAC_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  worker:
    profiles: ["app"]
    build: { context: ., target: api }
    command: ["node", "dist/worker/main.js"]
    environment:
      DATABASE_URL: postgresql://app_login:${APP_DB_PASSWORD:-}@postgres:5432/prospecting?schema=public
      REDIS_URL: redis://redis:6379
      HMAC_SECRET: ${HMAC_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      WORKER_METRICS_FILE: /metrics/worker.prom
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    volumes: ["worker_metrics:/metrics"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.9.1
    command: ["--collector.textfile.directory=/metrics", "--collector.disable-defaults", "--collector.textfile"]
    volumes: ["worker_metrics:/metrics:ro"]
    restart: unless-stopped
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.28.1
    # Alertmanager no expande variables: el entrypoint sustituye el URL placeholder por ALERT_WEBHOOK_URL.
    entrypoint: ["/bin/sh", "-c", "sed \"s|http://127.0.0.1:9/null|$${ALERT_WEBHOOK_URL}|\" /etc/alertmanager/alertmanager.yml > /tmp/am.yml && exec /bin/alertmanager --config.file=/tmp/am.yml --storage.path=/tmp/am"]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://127.0.0.1:9/null}
    volumes: ["./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["127.0.0.1:9093:9093"]
    restart: unless-stopped
  web:
    profiles: ["app"]
    build: { context: ., target: web }
    environment:
      API_URL: http://api:3001
      # Plain-HTTP local run of a production build; remove behind TLS so the session cookie is Secure.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp", "/app/apps/web/.next/cache"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  worker_metrics:
  postgres_data:
  redis_data:
